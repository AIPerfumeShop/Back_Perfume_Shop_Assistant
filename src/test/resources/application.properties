# Test-only config. Note: src/test/resources/application.properties completely
# replaces the main one on the Maven test classpath, so every key the context
# needs at startup must be defined here (with dummy values where required).
spring.application.name=spring_boot_project_api
server.port=${SERVER:0}

# In-memory H2 (MySQL compatibility mode) so no database is needed to run tests.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Telegram bot - no token means notifications are disabled (see TelegramServiceImpl).
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.bot.username=${TELEGRAM_BOT_USERNAME:}
telegram.bot.chat-id=${TELEGRAM_BOT_CHAT_ID:}

# OpenRouter - dummy key so the bean can be constructed in tests.
openrouter.api-key=${OPENROUTER_API_KEY:test-key}
openrouter.url=https://openrouter.ai/api/v1/chat/completions
openrouter.model=openrouter/free

# Cloudflare R2 (S3-compatible) - dummy values, client construction makes no calls.
R2_ACCOUNT_ID=test
r2.endpoint=https://test.r2.cloudflarestorage.com
r2.access-key-id=${R2_ACCESS_KEY_ID:test}
r2.secret-access-key=${R2_SECRET_ACCESS_KEY:test}
r2.bucket-name=${R2_BUCKET_NAME:perfume-products}
r2.public-url=${R2_PUBLIC_URL:}