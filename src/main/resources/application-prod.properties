# Production profile. Activate with SPRING_PROFILES_ACTIVE=prod (see .env).
# All values are env-driven; secrets have NO fallback so startup fails fast
# instead of silently using an insecure default.

# JWT: fail-fast — no default secret in production
jwt.secret=${JWT_SECRET}

# Database schema: never auto-mutate in production
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# CORS: allow only the real frontend origin(s)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Keep long polling off in deployments that run more than one instance;
# only one long-poll connection is allowed per Telegram bot token.
telegram.bot.enabled=${TELEGRAM_BOT_ENABLED:false}