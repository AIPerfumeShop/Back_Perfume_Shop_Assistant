spring.application.name=spring_boot_project_api
server.port=${SERVER:8089}
# All timestamps are LocalDateTime written in the JVM default time zone. Pin the
# Jackson serializer and the MySQL session to the same clock so analytics
# day-boundary queries (atStartOfDay) align with what customers see.
spring.jackson.time-zone=${APP_TIME_ZONE:Asia/Phnom_Penh}
# Comma-separated list of allowed CORS origins (see CorsConfig). Override in
# production via CORS_ALLOWED_ORIGINS, e.g. https://shop.example.com
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
# Per-IP rate limiting on sensitive auth endpoints (login, register, OTP verify, etc.)
# In-memory token bucket (single instance). Move to a shared store (Redis/gateway)
# when running multiple instances behind a load balancer.
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.capacity=${RATE_LIMIT_CAPACITY:5}
app.rate-limit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:60}
# OTP brute-force protection: max wrong guesses per code before a lockout window.
app.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
app.otp.lockout-minutes=${OTP_LOCKOUT_MINUTES:15}
# MySQL connection - works out of the box with either XAMPP (default root user, no
# password, port 3306) or `docker compose up -d` (see docker-compose.yml). Override any
# value with an environment variable, e.g. DB_HOST, DB_USERNAME, DB_PASSWORD.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:spring_boot_project_api}?createDatabaseIfNotExist=true&connectionTimeZone=Asia%2FPhnom_Penh&forceConnectionTimeZoneToSession=true&useLegacyDatetimeCode=false
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Telegram Bot (opt-in: set TELEGRAM_BOT_ENABLED=true in .env to run the poller)
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.bot.username=${TELEGRAM_BOT_USERNAME:}
telegram.bot.chat-id=${TELEGRAM_BOT_CHAT_ID:}
telegram.bot.enabled=${TELEGRAM_BOT_ENABLED:false}
# The bot's long-polling lifecycle is managed in TelegramServiceImpl.

# OpenRouter
openrouter.api-key=${OPENROUTER_API_KEY}
openrouter.url=https://openrouter.ai/api/v1/chat/completions
openrouter.model=openrouter/free

# Customer Care (support tickets start as PENDING instead of OPEN when the team is offline)
customer-care.offline=${CUSTOMER_CARE_OFFLINE:false}

# Password reset OTP emails (Gmail SMTP). Sender is GMAIL_USERNAME; for real
# delivery set GMAIL_APP_PASSWORD in .env to an app password for that account.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME:chansovannary27@gmail.com}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from-name=${APP_MAIL_FROM_NAME:Blossom Fragrance Perfume Shop}

# JWT authentication
jwt.secret=${JWT_SECRET:dev-only-secret-key-change-me-0123456789abcdef}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Google Sign-In (ID-token flow). Empty GOOGLE_CLIENT_ID disables Google auth.
google.auth.client-id=${GOOGLE_CLIENT_ID:}

# Cloudflare R2
r2.endpoint=https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
r2.access-key-id=${R2_ACCESS_KEY_ID}
r2.secret-access-key=${R2_SECRET_ACCESS_KEY}
r2.bucket-name=${R2_BUCKET_NAME:perfume-products}
r2.public-url=${R2_PUBLIC_URL}

# Bakong Configuration
bakong.account-id=${BAKONG_ACCOUNT_ID}
bakong.base-url=${BAKONG_BASE_URL}
bakong.email=${EMAIL}
bakong.merchant-name=${BAKONG_MERCHANT_NAME:John Smith}
bakong.merchant-city=${BAKONG_MERCHANT_CITY:PHNOM PENH}
bakong.merchant-id=${BAKONG_MERCHANT_ID:123456}
bakong.acquiring-bank=${BAKONG_ACQUIRING_BANK:Dev Bank}
bakong.mobile-number=${BAKONG_MOBILE_NUMBER:85512233455}
bakong.store-label=${BAKONG_STORE_LABEL:Blossom Fragrance Perfume Shop}
bakong.terminal-label=${BAKONG_TERMINAL_LABEL:TERMINAL1}

# Bakong KHQR payment reconciliation
payment.bakong.poll-interval-ms=${BAKONG_POLL_INTERVAL_MS:15000}
payment.bakong.payment-expiry-minutes=${BAKONG_PAYMENT_EXPIRY_MINUTES:15}